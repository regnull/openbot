version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /etc
    - /dev/urandom
    - /var/log
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:
  github:
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: audit
        access: full
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: audit
        access: full
      - host: objects.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: audit
        access: read-only
    binaries:
      # `git clone/fetch/push` execs git-remote-https (a symlink to this real
      # binary) — list the real path, not the symlink.
      - path: /usr/lib/git-core/git-remote-http
      - path: /usr/bin/gh
      - path: /usr/bin/curl
      # uv downloads CPython builds from github.com/astral-sh releases
      - path: /sandbox/.local/bin/uv
  pypi:
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: audit
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: audit
        access: read-only
    binaries:
      # pip runs as the python3.12 interpreter — list the interpreter's real
      # path (scripts exec their interpreter; pip3 itself is a python script).
      - path: /usr/bin/python3.12
      # uv resolves/downloads packages over HTTPS
      - path: /sandbox/.local/bin/uv
      - path: /usr/bin/curl
  astral_releases:
    endpoints:
      # uv fetches managed CPython builds from python-build-standalone releases
      - host: releases.astral.sh
        port: 443
        protocol: rest
        enforcement: audit
        access: read-only
      - host: github.com
        port: 443
        protocol: rest
        enforcement: audit
        access: read-only
    binaries:
      - path: /sandbox/.local/bin/uv
