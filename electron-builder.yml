appId: com.openbot.desktop
productName: OpenBot
copyright: "Copyright © OpenBot"
directories:
  output: release
files:
  - electron/**/*
  - dist/**/*
extraResources:
  - from: ../backend
    to: backend
    # uv creates .venv with an absolute shebang back to the machine that ran `uv sync`, so a
    # bundled .venv is not relocatable: on any other machine it points at a path that doesn't
    # exist. Ship the source, pyproject.toml, and uv.lock instead, and let electron-backend.sh's
    # `uv run` build a venv rooted in the *installed* app on first launch.
    filter:
      - "**/*"
      - "!.venv"
      - "!.venv/**"
      - "!**/__pycache__/**"
      - "!.pytest_cache/**"
      - "!.ruff_cache/**"
      - "!.mypy_cache/**"
      - "!logs/**"
      - "!openbot.db*"
      - "!openbot.langgraph.db*"
  - from: ../scripts/electron-backend.sh
    to: backend/electron-backend.sh
  - from: ../tools
    to: tools
icon: electron/assets/icon.png
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    CFBundleDisplayName: OpenBot
    CFBundleName: OpenBot
    LSApplicationCategoryType: public.app-category.developer-tools
win:
  target: nsis
linux:
  target: AppImage
