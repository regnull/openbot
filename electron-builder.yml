appId: com.openbot.desktop
productName: OpenBot
copyright: "Copyright © OpenBot"
directories:
  output: release
files:
  - electron/**/*
  - dist/**/*
extraResources:
  - from: ../backend
    to: backend
  - from: ../scripts/electron-backend.sh
    to: backend/electron-backend.sh
  - from: ../tools
    to: tools
icon: electron/assets/icon.png
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    CFBundleDisplayName: OpenBot
    CFBundleName: OpenBot
    LSApplicationCategoryType: public.app-category.developer-tools
win:
  target: nsis
linux:
  target: AppImage
