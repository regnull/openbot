appId: com.openbot.desktop
productName: OpenBot
# The backend remains a separately managed local service. The packaged UI uses
# the same API and can also target a remote instance with OPENBOT_URL.
directories:
  output: frontend/release
files:
  - electron/**/*
  - dist/**/*
# Relative to frontend/ (the project dir). electron-builder generates the
# platform .icns/.ico from this PNG; main.cjs uses it for the window icon.
icon: electron/assets/icon.png
mac:
  target: dmg
win:
  target: nsis
linux:
  target: AppImage
