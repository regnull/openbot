<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenBot — AI-powered bot orchestration platform" />
    <meta property="og:title" content="OpenBot" />
    <meta property="og:description" content="AI-powered bot orchestration platform" />
    <meta property="og:image" content="%VITE_SITE_URL%/logo-lockup-dark.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f4ef" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1426" />
    <title>OpenBot</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try {
        var t = localStorage.getItem("openbot:theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
