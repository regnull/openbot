[project]
name = "openbot"
version = "0.1.0"
description = "Open-source multi-bot AI platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141",
  "uvicorn[standard]>=0.52",
  "pydantic>=2.13",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "sqlalchemy[asyncio]>=2.0.52",
  "aiosqlite>=0.22",
  "alembic>=1.20",
  "httpx>=0.28",
  "langchain>=1.4",
  "langchain-core>=1.6",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "langgraph-checkpoint-postgres>=3.1",
  "langchain-openai>=1.6",
  "langchain-anthropic>=1.7",
  "langmem>=0.0.30",
  "langsmith>=0.12",
  "beautifulsoup4>=4.12",
  "langchain-ollama>=1.0",
  "langchain-mcp-adapters>=0.3.2",
  "cryptography>=50.0.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "asgi-lifespan>=2.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["smoke: live provider calls (costs money)"]
# Smoke tests hit real provider APIs and bill real tokens, so they are opt-in: `make smoke`
# (or `uv run pytest -m smoke`) is the only thing that runs them.
addopts = "-m 'not smoke'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbot"]
